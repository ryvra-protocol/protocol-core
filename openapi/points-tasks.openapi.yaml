openapi: 3.1.0
info:
  title: Ryvra Points/Tasks API
  version: 2026-08-08.v1
  summary: Canonical endpoint-level contract for Points/Tasks parity.
  description: |
    This OpenAPI document is the canonical HTTP contract for Points and Tasks reads in `protocol-core`.

    Versioning and compatibility policy:
    - API version marker is returned as `x-api-version` and `meta.api_version`.
    - Additive changes are allowed within this version family.
    - Breaking changes require a new version marker and migration notes.
    - Deprecations require at least 180 days and two minor contract revisions before removal.
    - Deprecated `page` pagination support is retained for compatibility and may be removed no earlier than 2027-02-04.

    Idempotency policy:
    - v1 is read-only (GET endpoints only), so `x-idempotency-key` is not required on current routes.
    - Future write endpoints will require `x-idempotency-key` and will be announced in the changelog.
  x-changelog-path: docs/api-contract-changelog.md
  x-tracking-issue-url: https://github.com/ryvra-protocol/protocol-core/issues/new?title=Points%2FTasks%20API%20contract%20updates
servers:
  - url: /
    description: Canonical paths only. Environment-specific hosts are deployment-owned.
externalDocs:
  description: Points/Tasks API contract changelog.
  url: ../docs/api-contract-changelog.md
x-compatibility-policy:
  api_version_header: x-api-version
  api_version_value: 2026-08-08.v1
  deprecation_notice_minimum_days: 180
  deprecation_notice_minimum_minor_revisions: 2
  deprecated_page_removal_not_before: "2027-02-04"
  changelog_path: docs/api-contract-changelog.md
x-path-migrations:
  deprecated_paths: []
  notes: Canonical paths match current Points/Tasks MVP route expectations.
tags:
  - name: Points
    description: Read endpoints for points entries and aggregates.
  - name: Tasks
    description: Read endpoints for task records and aggregates.
  - name: Status
    description: Service status and liveness endpoints.
security:
  - bearerAuth: []
paths:
  /points-tasks/points/entries:
    get:
      tags:
        - Points
      summary: List point entries
      operationId: listPointEntries
      description: |
        Returns account-scoped point entries.

        Pagination and sorting conventions:
        - `cursor` is canonical.
        - `limit` defaults to 50 (max 200).
        - Deprecated `page` is translated server-side to cursor semantics while compatibility support remains active.
        - If both `cursor` and `page` are set, `cursor` wins.
      x-scope-requirements:
        required:
          - account_id
        optional:
          - user_id
          - workspace_id
      parameters:
        - $ref: "#/components/parameters/XRequestIdHeader"
        - $ref: "#/components/parameters/XCorrelationIdHeader"
        - $ref: "#/components/parameters/AccountIdQuery"
        - $ref: "#/components/parameters/UserIdQuery"
        - $ref: "#/components/parameters/WorkspaceIdQuery"
        - $ref: "#/components/parameters/CursorQuery"
        - $ref: "#/components/parameters/LimitQuery"
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/EntryTypeQuery"
        - $ref: "#/components/parameters/EntryStatusQuery"
        - $ref: "#/components/parameters/EntrySourceQuery"
        - $ref: "#/components/parameters/PointsSortQuery"
        - $ref: "#/components/parameters/OccurredFromQuery"
        - $ref: "#/components/parameters/OccurredToQuery"
      responses:
        "200":
          description: Point entries returned.
          headers:
            x-request-id:
              $ref: "#/components/headers/XRequestIdResponseHeader"
            x-correlation-id:
              $ref: "#/components/headers/XCorrelationIdResponseHeader"
            x-api-version:
              $ref: "#/components/headers/XApiVersionResponseHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PointEntriesResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "429":
          $ref: "#/components/responses/TooManyRequestsError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"
  /points-tasks/points/summary:
    get:
      tags:
        - Points
      summary: Get points summary
      operationId: getPointsSummary
      description: Returns account-scoped points totals and rollups.
      x-scope-requirements:
        required:
          - account_id
        optional:
          - user_id
          - workspace_id
      parameters:
        - $ref: "#/components/parameters/XRequestIdHeader"
        - $ref: "#/components/parameters/XCorrelationIdHeader"
        - $ref: "#/components/parameters/AccountIdQuery"
        - $ref: "#/components/parameters/UserIdQuery"
        - $ref: "#/components/parameters/WorkspaceIdQuery"
        - $ref: "#/components/parameters/WindowQuery"
        - $ref: "#/components/parameters/OccurredFromQuery"
        - $ref: "#/components/parameters/OccurredToQuery"
      responses:
        "200":
          description: Points summary returned.
          headers:
            x-request-id:
              $ref: "#/components/headers/XRequestIdResponseHeader"
            x-correlation-id:
              $ref: "#/components/headers/XCorrelationIdResponseHeader"
            x-api-version:
              $ref: "#/components/headers/XApiVersionResponseHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PointSummaryResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "429":
          $ref: "#/components/responses/TooManyRequestsError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"
  /points-tasks/points/overview:
    get:
      tags:
        - Points
      summary: Get points overview
      operationId: getPointsOverview
      description: Returns account-scoped high-level points metrics and trends.
      x-scope-requirements:
        required:
          - account_id
        optional:
          - user_id
          - workspace_id
      parameters:
        - $ref: "#/components/parameters/XRequestIdHeader"
        - $ref: "#/components/parameters/XCorrelationIdHeader"
        - $ref: "#/components/parameters/AccountIdQuery"
        - $ref: "#/components/parameters/UserIdQuery"
        - $ref: "#/components/parameters/WorkspaceIdQuery"
        - $ref: "#/components/parameters/WindowQuery"
      responses:
        "200":
          description: Points overview returned.
          headers:
            x-request-id:
              $ref: "#/components/headers/XRequestIdResponseHeader"
            x-correlation-id:
              $ref: "#/components/headers/XCorrelationIdResponseHeader"
            x-api-version:
              $ref: "#/components/headers/XApiVersionResponseHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PointOverviewResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "429":
          $ref: "#/components/responses/TooManyRequestsError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"
  /points-tasks/tasks:
    get:
      tags:
        - Tasks
      summary: List tasks
      operationId: listTasks
      description: |
        Returns account-scoped task records.

        Pagination and sorting conventions:
        - `cursor` is canonical.
        - `limit` defaults to 50 (max 200).
        - Deprecated `page` is translated server-side to cursor semantics while compatibility support remains active.
        - If both `cursor` and `page` are set, `cursor` wins.
      x-scope-requirements:
        required:
          - account_id
        optional:
          - user_id
          - workspace_id
      parameters:
        - $ref: "#/components/parameters/XRequestIdHeader"
        - $ref: "#/components/parameters/XCorrelationIdHeader"
        - $ref: "#/components/parameters/AccountIdQuery"
        - $ref: "#/components/parameters/UserIdQuery"
        - $ref: "#/components/parameters/WorkspaceIdQuery"
        - $ref: "#/components/parameters/CursorQuery"
        - $ref: "#/components/parameters/LimitQuery"
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/TaskTypeQuery"
        - $ref: "#/components/parameters/TaskStatusQuery"
        - $ref: "#/components/parameters/TaskProgressStateQuery"
        - $ref: "#/components/parameters/TaskSortQuery"
        - $ref: "#/components/parameters/DueAfterQuery"
        - $ref: "#/components/parameters/DueBeforeQuery"
      responses:
        "200":
          description: Task records returned.
          headers:
            x-request-id:
              $ref: "#/components/headers/XRequestIdResponseHeader"
            x-correlation-id:
              $ref: "#/components/headers/XCorrelationIdResponseHeader"
            x-api-version:
              $ref: "#/components/headers/XApiVersionResponseHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskListResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "429":
          $ref: "#/components/responses/TooManyRequestsError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"
  /points-tasks/tasks/summary:
    get:
      tags:
        - Tasks
      summary: Get task summary
      operationId: getTaskSummary
      description: Returns account-scoped task status/progress aggregates.
      x-scope-requirements:
        required:
          - account_id
        optional:
          - user_id
          - workspace_id
      parameters:
        - $ref: "#/components/parameters/XRequestIdHeader"
        - $ref: "#/components/parameters/XCorrelationIdHeader"
        - $ref: "#/components/parameters/AccountIdQuery"
        - $ref: "#/components/parameters/UserIdQuery"
        - $ref: "#/components/parameters/WorkspaceIdQuery"
      responses:
        "200":
          description: Task summary returned.
          headers:
            x-request-id:
              $ref: "#/components/headers/XRequestIdResponseHeader"
            x-correlation-id:
              $ref: "#/components/headers/XCorrelationIdResponseHeader"
            x-api-version:
              $ref: "#/components/headers/XApiVersionResponseHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskSummaryResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "429":
          $ref: "#/components/responses/TooManyRequestsError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"
  /points-tasks/tasks/overview:
    get:
      tags:
        - Tasks
      summary: Get task overview
      operationId: getTaskOverview
      description: Returns account-scoped task throughput and risk indicators.
      x-scope-requirements:
        required:
          - account_id
        optional:
          - user_id
          - workspace_id
      parameters:
        - $ref: "#/components/parameters/XRequestIdHeader"
        - $ref: "#/components/parameters/XCorrelationIdHeader"
        - $ref: "#/components/parameters/AccountIdQuery"
        - $ref: "#/components/parameters/UserIdQuery"
        - $ref: "#/components/parameters/WorkspaceIdQuery"
        - $ref: "#/components/parameters/WindowQuery"
      responses:
        "200":
          description: Task overview returned.
          headers:
            x-request-id:
              $ref: "#/components/headers/XRequestIdResponseHeader"
            x-correlation-id:
              $ref: "#/components/headers/XCorrelationIdResponseHeader"
            x-api-version:
              $ref: "#/components/headers/XApiVersionResponseHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskOverviewResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "429":
          $ref: "#/components/responses/TooManyRequestsError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"
  /points-tasks/status:
    get:
      tags:
        - Status
      summary: Get Points/Tasks service status
      operationId: getPointsTasksStatus
      description: |
        Returns authenticated service status and dependency health summary.
        Scope fields are optional and can be used for scoped diagnostics.
      x-scope-requirements:
        required: []
        optional:
          - account_id
          - user_id
          - workspace_id
      parameters:
        - $ref: "#/components/parameters/XRequestIdHeader"
        - $ref: "#/components/parameters/XCorrelationIdHeader"
        - $ref: "#/components/parameters/OptionalAccountIdQuery"
        - $ref: "#/components/parameters/UserIdQuery"
        - $ref: "#/components/parameters/WorkspaceIdQuery"
      responses:
        "200":
          description: Service status returned.
          headers:
            x-request-id:
              $ref: "#/components/headers/XRequestIdResponseHeader"
            x-correlation-id:
              $ref: "#/components/headers/XCorrelationIdResponseHeader"
            x-api-version:
              $ref: "#/components/headers/XApiVersionResponseHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"
  /points-tasks/status/health:
    get:
      tags:
        - Status
      summary: Health check endpoint
      operationId: getPointsTasksHealth
      description: Canonical liveness/readiness endpoint.
      security: []
      x-scope-requirements:
        required: []
        optional: []
      parameters:
        - $ref: "#/components/parameters/XRequestIdHeader"
      responses:
        "200":
          description: Service is healthy.
          headers:
            x-request-id:
              $ref: "#/components/headers/XRequestIdResponseHeader"
            x-api-version:
              $ref: "#/components/headers/XApiVersionResponseHeader"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  headers:
    XRequestIdResponseHeader:
      description: Request identifier generated or echoed by the API.
      schema:
        type: string
    XCorrelationIdResponseHeader:
      description: Correlation identifier echoed by the API when provided.
      schema:
        type: string
    XApiVersionResponseHeader:
      description: Canonical API contract version marker.
      schema:
        $ref: "#/components/schemas/ApiVersion"
  parameters:
    XRequestIdHeader:
      name: x-request-id
      in: header
      required: false
      description: |
        Optional caller-provided request id for tracing.
        The server always returns `x-request-id` in responses.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    XCorrelationIdHeader:
      name: x-correlation-id
      in: header
      required: false
      description: Optional correlation id for cross-service tracing.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    AccountIdQuery:
      name: account_id
      in: query
      required: true
      description: Canonical account scope identifier.
      schema:
        type: string
        minLength: 1
    OptionalAccountIdQuery:
      name: account_id
      in: query
      required: false
      description: Optional account scope identifier used for scoped diagnostics.
      schema:
        type: string
        minLength: 1
    UserIdQuery:
      name: user_id
      in: query
      required: false
      description: Optional user scope within the account.
      schema:
        type: string
        minLength: 1
    WorkspaceIdQuery:
      name: workspace_id
      in: query
      required: false
      description: Optional workspace scope within the account.
      schema:
        type: string
        minLength: 1
    CursorQuery:
      name: cursor
      in: query
      required: false
      description: Opaque cursor returned by a previous page response.
      schema:
        type: string
        minLength: 1
    LimitQuery:
      name: limit
      in: query
      required: false
      description: Page size for cursor pagination.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    PageQuery:
      name: page
      in: query
      required: false
      deprecated: true
      description: Deprecated page-number pagination compatibility parameter.
      schema:
        type: integer
        minimum: 1
    WindowQuery:
      name: window
      in: query
      required: false
      description: Aggregation window.
      schema:
        type: string
        enum:
          - 24h
          - 7d
          - 30d
          - 90d
          - custom
        default: 30d
    OccurredFromQuery:
      name: occurred_from
      in: query
      required: false
      description: Inclusive lower timestamp bound (ISO 8601).
      schema:
        type: string
        format: date-time
    OccurredToQuery:
      name: occurred_to
      in: query
      required: false
      description: Exclusive upper timestamp bound (ISO 8601).
      schema:
        type: string
        format: date-time
    EntryTypeQuery:
      name: entry_type
      in: query
      required: false
      description: Filter by point entry type.
      schema:
        $ref: "#/components/schemas/PointEntryType"
    EntryStatusQuery:
      name: entry_status
      in: query
      required: false
      description: Filter by point entry status.
      schema:
        $ref: "#/components/schemas/PointEntryStatus"
    EntrySourceQuery:
      name: entry_source
      in: query
      required: false
      description: Filter by point entry source.
      schema:
        $ref: "#/components/schemas/PointEntrySource"
    PointsSortQuery:
      name: sort
      in: query
      required: false
      description: Sort order for points entries.
      schema:
        type: string
        enum:
          - "occurred_at:desc"
          - "occurred_at:asc"
          - "created_at:desc"
          - "created_at:asc"
        default: "occurred_at:desc"
    TaskTypeQuery:
      name: task_type
      in: query
      required: false
      description: Filter by task type.
      schema:
        $ref: "#/components/schemas/TaskType"
    TaskStatusQuery:
      name: task_status
      in: query
      required: false
      description: Filter by task status.
      schema:
        $ref: "#/components/schemas/TaskStatus"
    TaskProgressStateQuery:
      name: progress_state
      in: query
      required: false
      description: Filter by task progress state.
      schema:
        $ref: "#/components/schemas/TaskProgressState"
    TaskSortQuery:
      name: sort
      in: query
      required: false
      description: Sort order for task listings.
      schema:
        type: string
        enum:
          - "updated_at:desc"
          - "updated_at:asc"
          - "created_at:desc"
          - "created_at:asc"
          - "due_at:asc"
          - "due_at:desc"
        default: "updated_at:desc"
    DueAfterQuery:
      name: due_after
      in: query
      required: false
      description: Filter tasks due on/after this timestamp.
      schema:
        type: string
        format: date-time
    DueBeforeQuery:
      name: due_before
      in: query
      required: false
      description: Filter tasks due before this timestamp.
      schema:
        type: string
        format: date-time
  responses:
    BadRequestError:
      description: Request validation failed.
      headers:
        x-request-id:
          $ref: "#/components/headers/XRequestIdResponseHeader"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    UnauthorizedError:
      description: Authentication credentials are missing or invalid.
      headers:
        x-request-id:
          $ref: "#/components/headers/XRequestIdResponseHeader"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ForbiddenError:
      description: Caller lacks required scope permissions.
      headers:
        x-request-id:
          $ref: "#/components/headers/XRequestIdResponseHeader"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    TooManyRequestsError:
      description: Rate limit exceeded.
      headers:
        x-request-id:
          $ref: "#/components/headers/XRequestIdResponseHeader"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ServiceUnavailableError:
      description: Service or dependency temporarily unavailable.
      headers:
        x-request-id:
          $ref: "#/components/headers/XRequestIdResponseHeader"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InternalError:
      description: Unhandled internal server error.
      headers:
        x-request-id:
          $ref: "#/components/headers/XRequestIdResponseHeader"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    ApiVersion:
      type: string
      enum:
        - 2026-08-08.v1
      description: Canonical Points/Tasks API version marker.
    ErrorCode:
      type: string
      enum:
        - invalid_request
        - unauthorized
        - forbidden
        - not_found
        - conflict
        - rate_limited
        - upstream_unavailable
        - internal_error
    ErrorSource:
      type: string
      enum:
        - points_tasks_api
        - tasks_engine
        - policy_risk
        - ledger_settlement
        - pay
        - governance
        - unknown
    ErrorEnvelope:
      type: object
      required:
        - code
        - message
        - retryable
        - source
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        retryable:
          type: boolean
        source:
          $ref: "#/components/schemas/ErrorSource"
        details:
          oneOf:
            - type: object
              additionalProperties: true
            - type: array
              items: {}
            - type: string
          description: Optional error metadata.
        request_id:
          type: string
        correlation_id:
          type: string
      additionalProperties: false
    ScopeContext:
      type: object
      required:
        - account_id
      properties:
        account_id:
          type: string
        user_id:
          type:
            - string
            - "null"
        workspace_id:
          type:
            - string
            - "null"
      additionalProperties: false
    ResponseMeta:
      type: object
      required:
        - api_version
        - generated_at
        - scope
      properties:
        api_version:
          $ref: "#/components/schemas/ApiVersion"
        generated_at:
          type: string
          format: date-time
        scope:
          $ref: "#/components/schemas/ScopeContext"
        deprecated_page:
          type:
            - object
            - "null"
          required:
            - page
            - translated_to_cursor
            - removal_not_before
          properties:
            page:
              type: integer
              minimum: 1
            translated_to_cursor:
              type: string
            removal_not_before:
              type: string
              format: date
          additionalProperties: false
      additionalProperties: false
    CursorPage:
      type: object
      required:
        - limit
        - has_more
      properties:
        next_cursor:
          type:
            - string
            - "null"
        limit:
          type: integer
          minimum: 1
          maximum: 200
        has_more:
          type: boolean
      additionalProperties: false
    PointEntryType:
      type: string
      enum:
        - transaction_reward
        - task_completion_bonus
        - referral_bonus
        - manual_adjustment
        - penalty
        - reversal
    PointEntryStatus:
      type: string
      enum:
        - pending
        - confirmed
        - rejected
        - reversed
        - expired
    PointEntrySource:
      type: string
      enum:
        - ledger_settlement
        - policy_risk
        - tasks_engine
        - admin_console
        - system_migration
    PointEntry:
      type: object
      required:
        - entry_id
        - account_id
        - entry_type
        - entry_status
        - entry_source
        - points_delta
        - occurred_at
        - created_at
      properties:
        entry_id:
          type: string
        account_id:
          type: string
        user_id:
          type:
            - string
            - "null"
        workspace_id:
          type:
            - string
            - "null"
        task_id:
          type:
            - string
            - "null"
        ledger_event_id:
          type:
            - string
            - "null"
        reference_id:
          type:
            - string
            - "null"
        entry_type:
          $ref: "#/components/schemas/PointEntryType"
        entry_status:
          $ref: "#/components/schemas/PointEntryStatus"
        entry_source:
          $ref: "#/components/schemas/PointEntrySource"
