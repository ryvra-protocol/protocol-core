name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  docs:
    name: Markdown and docs checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint markdown
        run: pnpm lint
      - name: Verify required docs
        run: |
          test -f README.md
          test -f docs/rfc-0001-aa-unified-assets.md
          test -f docs/tokenomics-proof-of-transaction.md
          test -f docs/tokenomics-faq.md
          test -f docs/brand-narrative.md
          test -f CONTRIBUTING.md
          test -f SECURITY.md

  contracts:
    name: Contracts typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck contracts
        run: pnpm --filter ./contracts run typecheck
      - name: Test contracts
        run: pnpm --filter ./contracts run test

  policy-risk-adapter:
    name: Policy-risk adapter typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck policy-risk adapter
        run: pnpm --filter ./adapters/policy-risk run typecheck
      - name: Test policy-risk adapter
        run: pnpm --filter ./adapters/policy-risk run test

  ledger-settlement-adapter:
    name: Ledger-settlement adapter typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck ledger-settlement adapter
        run: pnpm --filter ./adapters/ledger-settlement run typecheck
      - name: Test ledger-settlement adapter
        run: pnpm --filter ./adapters/ledger-settlement run test

  integration-sandbox:
    name: Integration sandbox typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck integration-sandbox
        run: pnpm --filter ./integration-sandbox run typecheck
      - name: Test integration-sandbox
        run: pnpm --filter ./integration-sandbox run test
